name: Published artifact inventory

on:
  schedule:
    - cron: "27 6 * * 2"
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag (empty checks the latest stable release)
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published inventory and look up advisories
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 tools/release_inventory.py release --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"

  pages:
    name: Published OSTree inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the active OSTree refs and look up advisories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_inventory.py pages-audit --repo "$GITHUB_REPOSITORY"
